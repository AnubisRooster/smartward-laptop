<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartWard</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #09090b; color: #e4e4e7;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: light) { body { background: #fafafa; color: #18181b; } }
  main { text-align: center; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 16px 0 4px; }
  p { margin: 0; color: #71717a; }
  .spin { width: 22px; height: 22px; margin: 18px auto 0; border-radius: 50%; border: 3px solid #3f3f46; border-top-color: #818cf8; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #slow { display: none; margin-top: 16px; font-size: 13px; }
  code { font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>SmartWard</h1>
  <p>Starting up…</p>
  <div class="spin" role="status" aria-label="Starting"></div>
  <p id="slow">This is taking a while. The log is in <code>~/.local/state/smartward/api.log</code>.</p>
</main>
<script>setTimeout(function () { document.getElementById('slow').style.display = 'block'; }, 25000);</script>
</body>
</html>
